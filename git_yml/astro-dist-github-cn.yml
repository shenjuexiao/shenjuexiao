# 改写，部署其他仓库，使用 peaceiris/actions-gh-pages

name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支时触发此工作流程
  # 如果你使用其他分支，请将 main 替换为你的分支名
  push:
    branches: [ main ]
  # 允许在 GitHub Actions 标签页中手动触发此工作流程
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. 安装依赖并构建 Astro 站点
      - name: Install dependencies
        run: npm ci
        # 如果使用 pnpm，请取消注释以下行并注释上面的 npm 命令
        # run: pnpm install --frozen-lockfile
        # 如果使用 yarn，请取消注释以下行并注释上面的 npm 命令
        # run: yarn install --frozen-lockfile

      - name: Build Astro site
        run: npm run build
        # 如果使用 pnpm
        # run: pnpm run build
        # 如果使用 yarn
        # run: yarn build
        # env:
          # 可在此设置环境变量
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2'  

      # 3. 部署构建产物到 gh-pages 分支
      # 部署到外部仓库
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # GitHub 自动注入 GITHUB_TOKEN
          # github_token: ${{ secrets.GITHUB_TOKEN }}
          # 源仓库 Secrets 设置 PERSONAL_TOKEN
          personal_token: ${{ secrets.ASTRO_DIST }} 
          # 部署仓库（用户名/仓库）
          external_repository: shenjuexiao/astro-dist
          # 部署分支（默认 gh-pages）
          publish_branch: gh-pages
          # 部署文件夹（构建产物目录 Astro / VitePress 默认输出 dist）
          publish_dir: ./dist
          # 保留历史提交记录（可选）
          keep_files: false
          # 部署强制推送
          force_orphan: false
          # 提交信息（可选）
          commit_message: 'Deploy Astro site - ${{ github.sha }}'
          # 允许外部用户提交（可选，公共仓库建议设为 true）
          allow_empty_commit: false
          # 自定义域名（可选，如果你的站点使用自定义域名）
          # cname: www.example.com
          # 用户信息
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"