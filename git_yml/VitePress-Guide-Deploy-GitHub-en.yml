# VitePress-Guide-Deploy-GitHub-en.yml
# github.com/shenjuexiao
# 2026-07-24

# vitepress.dev/guide/deploy
# Deploy Your VitePress Site

# GitHub Pages

# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Not needed if lastUpdated is not enabled
          fetch-depth: 0
      # Uncomment this block if you're using pnpm
      # - uses: pnpm/action-setup@v4 
      #   with:
      # Not needed if you've set "packageManager" in package.json
      #     version: 9
      # Uncomment this if you're using Bun
      # - uses: oven-sh/setup-bun@v1
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # or pnpm / yarn
          cache: npm
          
      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-
            
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        # or pnpm install / yarn install / bun install
        run: npm ci
        
      - name: Build with VitePress
        # or pnpm docs:build / yarn docs:build / bun run docs:build
        run: npm run docs:build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4